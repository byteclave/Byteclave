openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Public ByteClave catalog and protected content management API.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: public-catalog
  - name: admin
  - name: admin-content
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /catalog/explore:
    get:
      operationId: getExploreCatalog
      tags: [public-catalog]
      summary: Get the public catalog index
      responses:
        "200":
          description: Published catalog overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExploreCatalog"
  /catalog/search:
    get:
      operationId: searchPublishedCatalog
      tags: [public-catalog]
      summary: Search published discoveries
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Matching published discoveries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Discovery"
  /catalog/categories/{slug}:
    get:
      operationId: getPublicCategory
      tags: [public-catalog]
      summary: Get a published category and its root discoveries
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Category catalog page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryPage"
        "404":
          $ref: "#/components/responses/NotFound"
  /catalog/categories/{categorySlug}/{subcategorySlug}:
    get:
      operationId: getPublicSubcategory
      tags: [public-catalog]
      summary: Get a published subcategory and its discoveries
      parameters:
        - name: categorySlug
          in: path
          required: true
          schema:
            type: string
        - name: subcategorySlug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Subcategory catalog page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubcategoryPage"
        "404":
          $ref: "#/components/responses/NotFound"
  /catalog/collections/{slug}:
    get:
      operationId: getPublicCollection
      tags: [public-catalog]
      summary: Get a public collection
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Collection catalog page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionPage"
        "404":
          $ref: "#/components/responses/NotFound"
  /catalog/discoveries/{slug}:
    get:
      operationId: getPublicDiscovery
      tags: [public-catalog]
      summary: Get a published discovery
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Published discovery detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryPage"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/session:
    get:
      operationId: getAdminSession
      tags: [admin]
      summary: Get the current admin session
      responses:
        "200":
          description: Authenticated administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/auth/login:
    post:
      operationId: loginAdmin
      tags: [admin]
      summary: Sign in to the administration area
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Sign in succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /admin/auth/logout:
    post:
      operationId: logoutAdmin
      tags: [admin]
      summary: Sign out of the administration area
      security:
        - AdminCookie: []
      responses:
        "200":
          description: Sign out succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin-content]
      summary: Get live catalog management metrics
      security:
        - AdminCookie: []
      responses:
        "200":
          description: Current content metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/catalog:
    get:
      operationId: getAdminCatalog
      tags: [admin-content]
      summary: List discoveries, taxonomy, tags, and collections
      security:
        - AdminCookie: []
      responses:
        "200":
          description: Content management catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCatalog"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/publishing:
    get:
      operationId: getAdminPublishingQueue
      tags: [admin-content]
      summary: List discoveries and publishing history
      security:
        - AdminCookie: []
      responses:
        "200":
          description: Publishing queue and recent decisions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishingQueue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/media:
    get:
      operationId: listAdminMedia
      tags: [admin-content]
      summary: List managed media assets
      security:
        - AdminCookie: []
      responses:
        "200":
          description: Media library
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MediaAsset" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: uploadAdminMedia
      tags: [admin-content]
      summary: Upload a validated media asset
      security:
        - AdminCookie: []
      parameters:
        - name: x-upload-filename
          in: header
          required: true
          schema: { type: string, maxLength: 180 }
        - name: x-upload-content-type
          in: header
          required: true
          schema: { type: string, enum: [image/png, image/jpeg, image/webp, application/pdf] }
        - name: x-upload-alt-text
          in: header
          required: false
          schema: { type: string, maxLength: 500 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Asset stored and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaAsset" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: Upload exceeds the 10 MB limit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/media/{id}:
    patch:
      operationId: updateAdminMedia
      tags: [admin-content]
      summary: Update media details or content assignment
      security:
        - AdminCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaAssignmentInput"
      responses:
        "200":
          description: Updated media asset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaAsset" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAdminMedia
      tags: [admin-content]
      summary: Delete an unreferenced media asset
      security:
        - AdminCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Asset deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /media/{storageKey}:
    get:
      operationId: getMediaAsset
      tags: [public-catalog]
      summary: Fetch media attached to published content or accessible to an administrator
      security:
        - {}
        - AdminCookie: []
      parameters:
        - name: storageKey
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Media asset bytes
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/discoveries/{id}/preview:
    get:
      operationId: getAdminDiscoveryPreview
      tags: [admin-content]
      summary: Preview a discovery without publishing it
      security:
        - AdminCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Discovery preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discovery"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/discoveries/{id}/publishing-action:
    post:
      operationId: performAdminPublishingAction
      tags: [admin-content]
      summary: Submit, review, publish, unpublish, archive, or restore a discovery
      security:
        - AdminCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishingAction"
      responses:
        "200":
          description: Publishing action completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discovery"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/versions:
    get:
      operationId: listAdminContentVersions
      tags: [admin-content]
      summary: Inspect recorded content versions
      security:
        - AdminCookie: []
      parameters:
        - name: entityType
          in: query
          schema:
            type: string
            enum: [discovery, category, subcategory, tag, collection]
        - name: entityId
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Version snapshots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentVersionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/versions/{versionId}/restore:
    post:
      operationId: restoreAdminContentVersion
      tags: [admin-content]
      summary: Restore a version as a new recorded change
      security:
        - AdminCookie: []
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Restoration completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionRestoreResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /catalog/appearance:
    get:
      operationId: getPublicAppearance
      tags: [public-catalog]
      summary: Get supported public appearance settings
      responses:
        "200":
          description: Public homepage and footer copy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppearanceSettings"
  /admin/appearance:
    get:
      operationId: getAdminAppearance
      tags: [admin-content]
      summary: Get editable appearance settings
      security:
        - AdminCookie: []
      responses:
        "200":
          description: Supported appearance settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppearanceSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updateAdminAppearance
      tags: [admin-content]
      summary: Update supported appearance settings
      security:
        - AdminCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppearanceSettings"
      responses:
        "200":
          description: Appearance settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppearanceSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/discoveries:
    post:
      operationId: createDiscovery
      tags: [admin-content]
      summary: Create a discovery or return an existing URL match
      security:
        - AdminCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoveryInput"
      responses:
        "201":
          description: Discovery created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryWriteResult"
        "200":
          description: Existing URL match returned without duplication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryWriteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/discoveries/{id}:
    patch:
      operationId: updateDiscovery
      tags: [admin-content]
      summary: Edit a discovery and its placements
      security:
        - AdminCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoveryInput"
      responses:
        "200":
          description: Updated discovery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryWriteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteDiscovery
      tags: [admin-content]
      summary: Delete a discovery and its catalog relationships
      security:
        - AdminCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Discovery deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/categories:
    post:
      operationId: createCategory
      tags: [admin-content]
      summary: Create a category
      security:
        - AdminCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/categories/{id}:
    patch:
      operationId: updateCategory
      tags: [admin-content]
      summary: Edit or reorder a category
      security:
        - AdminCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteCategory
      tags: [admin-content]
      summary: Delete an empty category
      security:
        - AdminCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Category deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/categories/{categoryId}/subcategories:
    post:
      operationId: createSubcategory
      tags: [admin-content]
      summary: Create a subcategory
      security:
        - AdminCookie: []
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubcategoryInput"
      responses:
        "201":
          description: Subcategory created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subcategory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/subcategories/{id}:
    patch:
      operationId: updateSubcategory
      tags: [admin-content]
      summary: Edit, reorder, or move a subcategory
      security:
        - AdminCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubcategoryInput"
      responses:
        "200":
          description: Updated subcategory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subcategory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteSubcategory
      tags: [admin-content]
      summary: Delete a subcategory safely
      security:
        - AdminCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteSubcategoryInput"
      responses:
        "204":
          description: Subcategory deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/tags:
    post:
      operationId: createTag
      tags: [admin-content]
      summary: Create or reuse a normalized tag
      security:
        - AdminCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagInput"
      responses:
        "201":
          description: Created or existing normalized tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/tags/{id}:
    patch:
      operationId: updateTag
      tags: [admin-content]
      summary: Rename a tag
      security:
        - AdminCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagInput"
      responses:
        "200":
          description: Updated tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteTag
      tags: [admin-content]
      summary: Delete a tag from all discoveries
      security:
        - AdminCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Tag deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/collections:
    post:
      operationId: createCollection
      tags: [admin-content]
      summary: Create a collection with ordered discoveries
      security:
        - AdminCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionInput"
      responses:
        "201":
          description: Collection created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/collections/{id}:
    patch:
      operationId: updateCollection
      tags: [admin-content]
      summary: Edit or reorder a collection
      security:
        - AdminCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionInput"
      responses:
        "200":
          description: Updated collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteCollection
      tags: [admin-content]
      summary: Delete a collection
      security:
        - AdminCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Collection deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    AdminCookie:
      type: apiKey
      in: cookie
      name: byteclave_admin_session
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Record not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Duplicate or unsafe operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Too many attempts
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
      required: [ok]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    AdminLoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required: [email, password]
    AdminSession:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        email: { type: string }
        displayName: { type: string }
        roles:
          type: array
          items: { type: string, enum: [OWNER, ADMIN, EDITOR] }
        permissions:
          type: array
          items: { type: string }
      required: [id, userId, email, displayName, roles, permissions]
    AdminOverview:
      type: object
      properties:
        discoveries: { type: integer }
        publishedDiscoveries: { type: integer }
        reviewDiscoveries: { type: integer }
        draftDiscoveries: { type: integer }
        archivedDiscoveries: { type: integer }
        categories: { type: integer }
        collections: { type: integer }
        tags: { type: integer }
      required: [discoveries, publishedDiscoveries, reviewDiscoveries, draftDiscoveries, archivedDiscoveries, categories, collections, tags]
    Placement:
      type: object
      properties:
        categoryId: { type: string }
        categorySlug: { type: string }
        categoryName: { type: string }
        subcategoryId: { type: ["string", "null"] }
        subcategorySlug: { type: ["string", "null"] }
        subcategoryName: { type: ["string", "null"] }
        sortOrder: { type: integer }
      required: [categoryId, categorySlug, categoryName, subcategoryId, subcategorySlug, subcategoryName, sortOrder]
    Tag:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
      required: [id, slug, name]
    Discovery:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        url: { type: string }
        summary: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        status: { type: string, enum: [draft, review, published, archived] }
        tags:
          type: array
          items: { $ref: "#/components/schemas/Tag" }
        placements:
          type: array
          items: { $ref: "#/components/schemas/Placement" }
      required: [id, slug, title, url, summary, description, status, tags, placements]
    DiscoveryInput:
      type: object
      properties:
        slug: { type: string, maxLength: 120 }
        title: { type: string, minLength: 1, maxLength: 180 }
        url: { type: string, format: uri, maxLength: 4096 }
        summary: { type: ["string", "null"], maxLength: 500 }
        description: { type: ["string", "null"], maxLength: 10000 }
        tags:
          type: array
          items: { type: string, minLength: 1, maxLength: 80 }
          uniqueItems: true
        placements:
          type: array
          items:
            type: object
            properties:
              categoryId: { type: string, format: uuid }
              subcategoryId: { type: ["string", "null"], format: uuid }
              sortOrder: { type: integer, minimum: 0 }
            required: [categoryId, subcategoryId, sortOrder]
      required: [title, url, tags, placements]
    MediaAsset:
      type: object
      properties:
        id: { type: string, format: uuid }
        discoveryId: { type: ["string", "null"], format: uuid }
        storageKey: { type: string }
        fileName: { type: string }
        contentType: { type: string, enum: [image/png, image/jpeg, image/webp, application/pdf] }
        sizeBytes: { type: integer }
        altText: { type: ["string", "null"] }
        createdByUserId: { type: ["string", "null"], format: uuid }
        createdAt: { type: string, format: date-time }
        mediaUrl: { type: string }
      required: [id, discoveryId, storageKey, fileName, contentType, sizeBytes, altText, createdByUserId, createdAt, mediaUrl]
    MediaAssignmentInput:
      type: object
      properties:
        discoveryId: { type: ["string", "null"], format: uuid }
        altText: { type: ["string", "null"], maxLength: 500 }
      required: [discoveryId, altText]
    DiscoveryWriteResult:
      type: object
      properties:
        discovery: { $ref: "#/components/schemas/Discovery" }
        created: { type: boolean }
        duplicate: { type: boolean }
      required: [discovery, created, duplicate]
    Subcategory:
      type: object
      properties:
        id: { type: string }
        categoryId: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: ["string", "null"] }
        sortOrder: { type: integer }
        isVisible: { type: boolean }
        discoveryCount: { type: integer }
      required: [id, categoryId, slug, name, description, sortOrder, isVisible, discoveryCount]
    Category:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: ["string", "null"] }
        sortOrder: { type: integer }
        isVisible: { type: boolean }
        subcategories:
          type: array
          items: { $ref: "#/components/schemas/Subcategory" }
        discoveryCount: { type: integer }
      required: [id, slug, name, description, sortOrder, isVisible, subcategories, discoveryCount]
    CategoryInput:
      type: object
      properties:
        slug: { type: string, maxLength: 120 }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: ["string", "null"], maxLength: 2000 }
        sortOrder: { type: integer, minimum: 0, maximum: 100000 }
        isVisible: { type: boolean }
      required: [name, sortOrder, isVisible]
    SubcategoryInput:
      type: object
      properties:
        categoryId: { type: string, format: uuid }
        slug: { type: string, maxLength: 120 }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: ["string", "null"], maxLength: 2000 }
        sortOrder: { type: integer, minimum: 0, maximum: 100000 }
        isVisible: { type: boolean }
      required: [categoryId, name, sortOrder, isVisible]
    DeleteSubcategoryInput:
      type: object
      properties:
        moveDiscoveriesToCategoryRoot: { type: boolean }
      required: [moveDiscoveriesToCategoryRoot]
    TagInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
      required: [name]
    Collection:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: ["string", "null"] }
        sortOrder: { type: integer }
        discoveryIds:
          type: array
          items: { type: string }
      required: [id, slug, name, description, sortOrder, discoveryIds]
    CollectionInput:
      type: object
      properties:
        slug: { type: string, maxLength: 120 }
        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: ["string", "null"], maxLength: 2000 }
        sortOrder: { type: integer, minimum: 0, maximum: 100000 }
        discoveryIds:
          type: array
          items: { type: string, format: uuid }
          uniqueItems: true
      required: [name, sortOrder, discoveryIds]
    AdminCatalog:
      type: object
      properties:
        discoveries:
          type: array
          items: { $ref: "#/components/schemas/Discovery" }
        categories:
          type: array
          items: { $ref: "#/components/schemas/Category" }
        tags:
          type: array
          items: { $ref: "#/components/schemas/Tag" }
        collections:
          type: array
          items: { $ref: "#/components/schemas/Collection" }
      required: [discoveries, categories, tags, collections]
    PublishingAction:
      type: object
      properties:
        action:
          type: string
          enum: [submit_for_review, approve, reject, unpublish, archive, restore]
        note:
          type: string
          maxLength: 1000
      required: [action]
    PublishingQueue:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              slug: { type: string }
              title: { type: string }
              summary: { type: ["string", "null"] }
              description: { type: ["string", "null"] }
              url: { type: string, format: uri }
              status: { type: string, enum: [draft, review, published, archived] }
              updatedAt: { type: string, format: date-time }
            required: [id, slug, title, summary, description, url, status, updatedAt]
        history:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              discoveryId: { type: string }
              fromStatus: { type: string, enum: [draft, review, published, archived] }
              toStatus: { type: string, enum: [draft, review, published, archived] }
              actorUserId: { type: ["string", "null"] }
              actorEmail: { type: ["string", "null"] }
              note: { type: ["string", "null"] }
              createdAt: { type: string, format: date-time }
            required: [id, discoveryId, fromStatus, toStatus, actorUserId, actorEmail, note, createdAt]
      required: [items, history]
    ContentVersion:
      type: object
      properties:
        id: { type: string }
        entityType: { type: string, enum: [discovery, category, subcategory, tag, collection] }
        entityId: { type: string }
        action: { type: string, enum: [created, updated, deleted, restored] }
        snapshot: { type: object, additionalProperties: true }
        sourceVersionId: { type: ["string", "null"] }
        actorUserId: { type: ["string", "null"] }
        actorEmail: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, entityType, entityId, action, snapshot, sourceVersionId, actorUserId, actorEmail, createdAt]
    ContentVersionList:
      type: array
      items: { $ref: "#/components/schemas/ContentVersion" }
    VersionRestoreResult:
      type: object
      properties:
        entityType: { type: string, enum: [discovery, category, subcategory, tag, collection] }
        entityId: { type: string }
        restoredFromVersionId: { type: string }
      required: [entityType, entityId, restoredFromVersionId]
    AppearanceSettings:
      type: object
      properties:
        homepageEyebrow: { type: string, maxLength: 120 }
        homepageHeadline: { type: string, minLength: 1, maxLength: 180 }
        homepageDescription: { type: string, maxLength: 1000 }
        footerText: { type: string, maxLength: 180 }
      required: [homepageEyebrow, homepageHeadline, homepageDescription, footerText]
    ExploreCatalog:
      type: object
      properties:
        categories:
          type: array
          items: { $ref: "#/components/schemas/PublicCategory" }
        collections:
          type: array
          items: { $ref: "#/components/schemas/PublicCollection" }
        publishedDiscoveryCount: { type: integer }
      required: [categories, collections, publishedDiscoveryCount]
    PublicCategory:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: ["string", "null"] }
        subcategories:
          type: array
          items: { $ref: "#/components/schemas/PublicSubcategory" }
      required: [id, slug, name, description, subcategories]
    PublicSubcategory:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: ["string", "null"] }
      required: [id, slug, name, description]
    PublicCollection:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: ["string", "null"] }
        publishedDiscoveryCount: { type: integer }
      required: [slug, name, description, publishedDiscoveryCount]
    CategoryPage:
      type: object
      properties:
        category: { $ref: "#/components/schemas/PublicCategory" }
        subcategories:
          type: array
          items: { $ref: "#/components/schemas/PublicSubcategory" }
        discoveries:
          type: array
          items: { $ref: "#/components/schemas/Discovery" }
      required: [category, subcategories, discoveries]
    SubcategoryPage:
      type: object
      properties:
        category:
          type: object
          properties:
            slug: { type: string }
            name: { type: string }
          required: [slug, name]
        subcategory: { $ref: "#/components/schemas/PublicSubcategory" }
        discoveries:
          type: array
          items: { $ref: "#/components/schemas/Discovery" }
      required: [category, subcategory, discoveries]
    CollectionPage:
      type: object
      properties:
        collection: { $ref: "#/components/schemas/PublicCollection" }
        discoveries:
          type: array
          items: { $ref: "#/components/schemas/Discovery" }
      required: [collection, discoveries]
    DiscoveryPage:
      type: object
      properties:
        discovery: { $ref: "#/components/schemas/Discovery" }
        inspection:
          anyOf:
            - $ref: "#/components/schemas/InspectionDetails"
            - type: "null"
      required: [discovery, inspection]
    InspectionDetails:
      type: object
      properties:
        id: { type: string }
        status: { type: string }
        inspector: { type: string }
        inspectorVersion: { type: ["string", "null"] }
        startedAt: { type: ["string", "null"], format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
        observations:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              result: { type: string }
              summary: { type: string }
              details: { type: object, additionalProperties: true }
            required: [code, result, summary, details]
      required: [id, status, inspector, inspectorVersion, startedAt, completedAt, observations]

