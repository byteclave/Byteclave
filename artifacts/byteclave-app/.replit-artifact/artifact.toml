kind = "web"
previewPath = "/"
title = "ByteClave"
description = "An open-source catalog of useful digital resources, organized into categories and curated collections. Phase 1 establishes its application and data foundation."
version = "1.0.0"
id = "artifacts/byteclave-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21338

[services.development]
run = "pnpm --filter @workspace/byteclave-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/byteclave-app", "run", "build" ]
run = "pnpm --filter @workspace/byteclave-app run start"

[services.env]
PORT = "21338"
BASE_PATH = "/"
